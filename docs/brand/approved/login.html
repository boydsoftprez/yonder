<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!--
  The page a provisioned console serves to anyone without a session.

  Self-contained by requirement (R-UI-01): nothing here is fetched from
  anywhere. Day-themed for the same reason as the setup page (R-UI-07).

  A plain form, no script. That is not minimalism for its own sake: an
  operator reaching this over a cell link with hundreds of milliseconds of
  latency (R-UI-06) should be looking at a usable page after one round trip,
  and a browser with no JavaScript enabled should still be able to log in.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yonder — login design preview</title>
<style>
  :root {
    color-scheme: light;
    --ink: #14181d;
    --quiet: #4a5560;
    --paper: #f2f4f6;
    --card: #ffffff;
    --line: #c9d1d9;
    --accent: #16507a;
    --warn: #8a2f18;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1rem;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main {
    max-width: 26rem;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.75rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 1.75rem; letter-spacing: -0.01em; }
  h1 svg { display: block; width: 100%; max-width: 312px; height: auto; }
  label { display: block; font-weight: 600; margin: 0 0 .35rem; }
  input[type=password] {
    width: 100%;
    padding: .7rem .75rem;
    font: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 7px;
  }
  input[type=password]:focus { outline: 3px solid #bcd6ea; border-color: var(--accent); }
  button {
    margin-top: 1.25rem;
    width: 100%;
    padding: .8rem 1rem;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 7px;
    cursor: pointer;
  }
  .error {
    margin: 0 0 1.25rem;
    padding: .8rem 1rem;
    border-left: 4px solid var(--warn);
    background: #fbeeea;
    color: var(--warn);
    font-weight: 600;
  }
  .note { margin: 1.5rem 0 0; color: var(--quiet); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1 aria-label="Yonder"><svg xmlns="http://www.w3.org/2000/svg" width="312" height="65.932" viewBox="-8 -8 1325 280" aria-hidden="true" focusable="false"><defs>
    <filter id="yonder-brand-day-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity=".24"/>
    </filter>
    <linearGradient id="yonder-brand-day-blue" x1="0" y1="0" x2=".2" y2="1">
      <stop stop-color="#5e9bc3"/>
      <stop offset=".5" stop-color="#2c5f8f"/>
      <stop offset="1" stop-color="#234c70"/>
    </linearGradient>
    <linearGradient id="yonder-brand-day-ink" x1="0" y1="0" x2=".15" y2="1">
      <stop stop-color="#555c62"/>
      <stop offset=".5" stop-color="#292e33"/>
      <stop offset="1" stop-color="#3d444a"/>
    </linearGradient>
  </defs><g filter="url(#yonder-brand-day-shadow)"><g stroke="#ffffff" stroke-opacity=".22" stroke-width="1.4" stroke-linejoin="round" paint-order="stroke fill"><path fill="url(#yonder-brand-day-blue)" d="M16 164 188 75 170 162 0 204Z M264 75 436 164 452 204 282 162Z"/><path fill="url(#yonder-brand-day-ink)" d="M226 0 251 45 278 175 233 264V117L226 103 219 117V264L174 175 201 45Z"/></g><g transform="translate(456 63)" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.4" stroke-linejoin="round" paint-order="stroke fill">
    <path fill="url(#yonder-brand-day-blue)" d="M0 0H44L93 52 70 78Z"/>
    <g fill="url(#yonder-brand-day-ink)" fill-rule="evenodd"><path d="M155 0H196L121 88V154H81V88Z"/><path d="M194 48H282Q308 48 308 74V128Q308 154 282 154H194Q168 154 168 128V74Q168 48 194 48Z M210 75Q202 75 202 83V119Q202 127 210 127H266Q274 127 274 119V83Q274 75 266 75Z"/><path d="M323 154V48H414Q453 48 453 86V154H419V90Q419 76 405 76H357V154Z"/><path d="M571 0H605V154H504Q466 154 466 116V86Q466 48 504 48H571Z M510 75Q500 75 500 85V117Q500 127 510 127H571V75Z"/><path d="M651 48H720Q754 48 754 82V114H650V120Q650 130 661 130H746V154H651Q616 154 616 119V83Q616 48 651 48Z M650 90H720V83Q720 73 710 73H660Q650 73 650 83Z"/><path d="M767 154V86Q767 48 805 48H853V76H816Q801 76 801 91V154Z"/></g>
  </g></g></svg></h1>



  <form method="post" action="/login">
    <label for="password">Administrator password</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           disabled>
    <button type="button" disabled>Sign in</button>
  </form>

  <p class="note">Signing in ends when this console restarts, which it does whenever the
    device's configuration changes.</p>
</main>
</body>
</html>
