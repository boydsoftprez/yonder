<!--
  The editor half of scan for networks.

  Node-RED finds this by basename beside the node's .js, and without it the
  flow editor shows the node as "unknown" even though the runtime registered
  it. It is a form and a registration, and deliberately nothing else: no
  behaviour lives here (CLAUDE.md rule 2 in spirit — a diff has to be
  readable), and no asset is fetched from anywhere (R-UI-01).
-->
<script type="text/html" data-template-name="yonder-scan">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="yonder-scan">
<p>Reads <code>GET /net/scan</code> when a message arrives. Emits
<code>{ interface, networks }</code>, one row per network, strongest first.</p>
<p>Never returns a pre-shared key: a scan is a list of what is broadcasting,
which anything with a radio can already see.</p>
<p>Input-driven, never polled. On a single-radio board a scan retunes the radio
the operator is connected through.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("yonder-scan", {
    category: "yonder",
    color: "#c7d4e0",
    defaults: { name: { value: "" } },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-wifi",
    label: function () { return this.name || "scan for networks"; },
  });
</script>
