<!--
  The editor half of confirm the change.

  Node-RED finds this by basename beside the node's .js, and without it the
  flow editor shows the node as "unknown" even though the runtime registered
  it. It is a form and a registration, and deliberately nothing else: no
  behaviour lives here (CLAUDE.md rule 2 in spirit — a diff has to be
  readable), and no asset is fetched from anywhere (R-UI-01).
-->
<script type="text/html" data-template-name="yonder-confirm">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="yonder-confirm">
<p>Posts <code>POST /confirm</code> with the apply id, taken from
<code>msg.yonder.id</code>, <code>msg.payload.id</code> or a bare
<code>msg.payload</code> string.</p>
<p>The proof that a configuration is good is that the operator can still reach
the device to say so, which is why this is a separate control and not something
the apply does on its way out.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("yonder-confirm", {
    category: "yonder",
    color: "#c7d4e0",
    defaults: { name: { value: "" } },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-wifi",
    label: function () { return this.name || "confirm the change"; },
  });
</script>
