<!--
  The editor half of read cameras.

  Node-RED finds this by basename beside the node's .js, and without it the
  flow editor shows the node as "unknown" even though the runtime registered
  it. It is a form and a registration, and deliberately nothing else: no
  behaviour lives here (CLAUDE.md rule 2 in spirit — a diff has to be
  readable), and no asset is fetched from anywhere (R-UI-01).
-->
<script type="text/html" data-template-name="yonder-cameras">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="yonder-cameras">
<p>Reads <code>GET /cameras</code> when a message arrives and emits
<code>{ found, rejected }</code> on <code>msg.payload</code>.</p>
<p>Each found camera carries its capability line, and each rejection carries the
reason it was rejected — a hardware codec that advertises formats it cannot
capture, or a camera offering only raw frames. A rejection is a value here, not
a camera left out of the list.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("yonder-cameras", {
    category: "yonder",
    color: "#c7d4e0",
    defaults: { name: { value: "" } },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-video-camera",
    label: function () { return this.name || "read cameras"; },
  });
</script>
