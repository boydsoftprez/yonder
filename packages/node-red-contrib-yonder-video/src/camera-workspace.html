<script type="text/html" data-template-name="yonder-camera-workspace">
  <div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text" /></div>
</script>
<script type="text/html" data-help-name="yonder-camera-workspace">
  <p>Combines camera reports, authoritative pending status and explicit operation results into one complete camera workspace snapshot. Tag <code>msg.workspaceKind</code> as <code>report</code>, <code>pending</code> or <code>result</code>. It sends no device command.</p>
</script>
<script type="text/javascript">
  RED.nodes.registerType('yonder-camera-workspace', { category: 'yonder', color: '#c7d4e0', defaults: { name: { value: '' } }, inputs: 1, outputs: 1, icon: 'font-awesome/fa-video-camera', label: function () { return this.name || 'camera workspace'; } });
</script>
