<!--
  The editor half of the tape.

  Node-RED finds this by basename beside the node's .js. Without it the widget
  registers at runtime and shows as "unknown node" in the flow editor. It is a
  form and a registration and nothing else: no behaviour (CLAUDE.md rule 2),
  and no asset fetched from anywhere (R-UI-01).
-->
<script type="text/html" data-template-name="ui-yonder-tape">
  <div class="form-row"><label for="node-input-group"><i class="fa fa-table"></i> Group</label>
    <input type="text" id="node-input-group" /></div>
  <div class="form-row"><label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" /></div>
  <div class="form-row"><label for="node-input-label"><i class="fa fa-font"></i> Label</label>
    <input type="text" id="node-input-label" placeholder="THERMAL" /></div>
  <div class="form-row"><label for="node-input-unit"><i class="fa fa-thermometer-half"></i> Unit</label>
    <input type="text" id="node-input-unit" placeholder="&deg;C" /></div>
  <div class="form-row"><label for="node-input-min"><i class="fa fa-angle-down"></i> Min</label>
    <input type="number" id="node-input-min" placeholder="0" /></div>
  <div class="form-row"><label for="node-input-max"><i class="fa fa-angle-up"></i> Max</label>
    <input type="number" id="node-input-max" placeholder="100" /></div>
  <div class="form-row"><label for="node-input-caution"><i class="fa fa-exclamation-triangle"></i> Caution</label>
    <input type="number" id="node-input-caution" placeholder="(none)" /></div>
  <div class="form-row"><label for="node-input-limit"><i class="fa fa-ban"></i> Limit</label>
    <input type="number" id="node-input-limit" placeholder="(none)" /></div>
  <div class="form-row"><label for="node-input-limitLabel"><i class="fa fa-tag"></i> Limit label</label>
    <input type="text" id="node-input-limitLabel" placeholder="THROTTLE" /></div>
  <div class="form-row"><label for="node-input-divisions"><i class="fa fa-ellipsis-v"></i> Divisions</label>
    <input type="number" id="node-input-divisions" min="2" max="12" placeholder="5" /></div>
  <div class="form-row"><label for="node-input-height2"><i class="fa fa-arrows-v"></i> Scale height</label>
    <input type="number" id="node-input-height2" placeholder="196" /> px</div>
  <div class="form-tips">For a quantity that is watched rather than read once.
    Glanced values want a gauge instead.</div>
</script>
<script type="text/html" data-help-name="ui-yonder-tape">
<p>A vertical scale with a fill, a bug at the current value and a boxed
reading &mdash; the airspeed-tape idiom (R-UI-09).</p>
<p>Send a number on <code>msg.payload</code>. Bands come from
<code>reading()</code> in <code>yonder-core</code>.</p>
</script>
<script type="text/javascript">
  RED.nodes.registerType("ui-yonder-tape", {
    category: "dashboard 2",
    color: "#c7e0d4",
    defaults: {
      name: { value: "" },
      group: { type: "ui-group", required: true },
      order: { value: 0 }, width: { value: 0 }, height: { value: 0 },
      label: { value: "" }, unit: { value: "" },
      min: { value: 0, validate: RED.validators.number(true) },
      max: { value: 100, validate: RED.validators.number(true) },
      caution: { value: "", validate: RED.validators.number(true) },
      limit: { value: "", validate: RED.validators.number(true) },
      limitLabel: { value: "" },
      precision: { value: 1, validate: RED.validators.number(true) },
      divisions: { value: 5, validate: RED.validators.number(true) },
      height2: { value: 196, validate: RED.validators.number(true) }
    },
    inputs: 1, outputs: 0,
    icon: "font-awesome/fa-sliders",
    paletteLabel: "yonder tape",
    label: function () { return this.name || this.label || "yonder tape"; }
  });
</script>
