<!--
  The editor half of the Telemetry page's live reading.

  Node-RED finds this by basename beside the node's .js, and without it the
  flow editor shows the node as "unknown" even though the runtime registered
  it. It is a form and a registration, and deliberately nothing else: no
  behaviour lives here (CLAUDE.md rule 2 in spirit — a diff has to be
  readable), and no asset is fetched from anywhere (R-UI-01).
-->
<script type="text/html" data-template-name="yonder-mav-state">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="yonder-mav-state">
<p>Reads <code>GET /mav/state</code> when a message arrives. Emits one
payload shaped for every reading the Telemetry and Status pages show —
the autopilot link, the ground stations, the throughput sparkline and the
Status page's flow strip — already in words a page can bind directly
(R-MAV-10).</p>
<p>The daemon answers with <code>{ link, telemetryRunning, routerRunning }</code>,
not a bare link state, because <code>telemetryRunning</code> and
<code>routerRunning</code> are different questions that come apart exactly
while telemetry is stopped: the autopilot half of the page stays live and
the ground-station half goes neutral. Both are read here, never guessed
from the link alone.</p>
<p>On a build with no telemetry layer at all — every device today — the
route answers 503 and this node reports it the same way any other failed
read is reported: as a rejected state, never as silence (R-UI-05).</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("yonder-mav-state", {
    category: "yonder",
    color: "#c7d4e0",
    defaults: { name: { value: "" } },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-plane",
    label: function () { return this.name || "mav state"; },
  });
</script>
