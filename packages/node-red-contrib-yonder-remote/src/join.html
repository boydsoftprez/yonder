<!--
  The editor half of join the mesh.

  Node-RED finds this by basename beside the node's .js, and without it the
  flow editor shows the node as "unknown" even though the runtime registered
  it. It is a form and a registration, and deliberately nothing else: no
  behaviour lives here (CLAUDE.md rule 2 in spirit — a diff has to be
  readable), and no asset is fetched from anywhere (R-UI-01).
-->
<script type="text/html" data-template-name="yonder-remote-join">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="yonder-remote-join">
<p>Posts <code>{ networkId: msg.payload }</code> to
<code>POST /remote/join</code>.</p>
<p>The network id is not validated here: the daemon already refuses anything
that is not sixteen lowercase hexadecimal characters, and this node carries
whatever the operator typed.</p>
<p>The daemon puts the change through the apply engine, so what comes back is a
<b>pending</b> command state, not a confirmation that the mesh has joined.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("yonder-remote-join", {
    category: "yonder",
    color: "#c7d4e0",
    defaults: { name: { value: "" } },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-sign-in",
    label: function () { return this.name || "join the mesh"; },
  });
</script>
