<!--
  The editor half of mesh join state.

  Node-RED finds this by basename beside the node's .js, and without it the
  flow editor shows the node as "unknown" even though the runtime registered
  it. It is a form and a registration, and deliberately nothing else: no
  behaviour lives here (CLAUDE.md rule 2 in spirit — a diff has to be
  readable), and no asset is fetched from anywhere (R-UI-01).
-->
<script type="text/html" data-template-name="yonder-remote-state">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="yonder-remote-state">
<p>Reads <code>GET /remote/state</code> when a message arrives. Emits
<code>{ label, waiting, networkId, deviceId, address, detail }</code> — words
an operator reads, never a client's own vocabulary such as
<code>ACCESS_DENIED</code>.</p>
<p><code>waiting</code> is set while the device is waiting for the operator to
approve it in the controller. Nothing times this state out (R-VPN-06).</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("yonder-remote-state", {
    category: "yonder",
    color: "#c7d4e0",
    defaults: { name: { value: "" } },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-globe",
    label: function () { return this.name || "mesh join state"; },
  });
</script>
