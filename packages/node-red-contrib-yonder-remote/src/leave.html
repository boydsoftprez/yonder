<!--
  The editor half of leave the mesh.

  Node-RED finds this by basename beside the node's .js, and without it the
  flow editor shows the node as "unknown" even though the runtime registered
  it. It is a form and a registration, and deliberately nothing else: no
  behaviour lives here (CLAUDE.md rule 2 in spirit — a diff has to be
  readable), and no asset is fetched from anywhere (R-UI-01).
-->
<script type="text/html" data-template-name="yonder-remote-leave">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
</script>

<script type="text/html" data-help-name="yonder-remote-leave">
<p>Posts to <code>POST /remote/leave</code> with no body. Clears the
configured network id, taking the mesh interface down.</p>
<p>The daemon puts the change through the apply engine, so what comes back is a
<b>pending</b> command state.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("yonder-remote-leave", {
    category: "yonder",
    color: "#c7d4e0",
    defaults: { name: { value: "" } },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-sign-out",
    label: function () { return this.name || "leave the mesh"; },
  });
</script>
