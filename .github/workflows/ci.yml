name: CI
on:
  push: { branches: [main] }
  pull_request:
# Keep the newest PR checks moving on the shared runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Where these jobs run is a repository variable, not a line in this file.
#
# CI_RUNNER unset — a fresh clone, and this repository once it is public —
# means ubuntu-latest, which is free for public repositories. Set to a runner
# label, the jobs go to that runner instead, which is free for private ones.
# So the day the repository opens, deleting the variable is the whole change;
# nothing here has to be edited, and nothing here names a machine.
#
# Self-hosted is deliberately the private-only setting: a public repository
# would run a fork's pull request on that hardware.
jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # 24, not 20. Node-RED 5 refuses to start below 22.9, and the console's
      # generated settings.js and both contrib packages `require()` an ES
      # module, which node supports from 22.12 — so the node-red-node-test-
      # helper tests cannot run on 20 at all. 24 is the line the offline
      # payload ships (installer/make-payload.sh), so CI runs what a board runs.
      #
      # yonder-core's own floor of 20 is covered by the `core-on-its-floor`
      # job below, because a claim nothing tests is a claim that stops being
      # true without anyone noticing.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The installer builds the daemon on the board. A compile error that only
      # shows up there is found after the flash, not before it.
      - run: npm run build
      # The checked-in JSON Schema is generated from the Zod schema. If it can
      # drift, it is not the schema, it is a stale copy of one.
      - name: Check the generated schema is current
        run: |
          npm run schema -w yonder-core
          git diff --exit-code config/schema
      # The shipped default configuration is generated from DEFAULT_CONFIG and
      # seeded onto every clean board. A stale copy is a device that boots on a
      # configuration the schema no longer accepts.
      - name: Check the shipped default configuration is current
        run: |
          npm run defaults -w yonder-core
          git diff --exit-code config/defaults

  installer:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # The console role calls `require_node 22.12`, and require_node dies on a
      # node that is present and too old — including on a dry run. So this job
      # needs the same runtime the other one does.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # shellcheck ships on the GitHub-hosted image and is installed once on a
      # persistent runner, so the install is a fallback rather than a step: an
      # `apt-get update` on every job is a minute spent re-proving a binary is
      # already there. Still unconditional in effect — a runner without it
      # installs it and the job passes, rather than failing on host state.
      - name: Lint shell
        run: |
          command -v shellcheck >/dev/null \
            || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck installer/install.sh installer/make-payload.sh \
            installer/lib/*.sh installer/roles/*.sh scripts/*.sh
      - name: Installer dry run
        run: ./installer/install.sh --dry-run
      # The failure paths a dry run cannot reach. `run` short-circuits to a
      # printf when DRY_RUN=1, so nothing above this line has ever executed a
      # command that fails — which is how `run … || true`, two lines that
      # could abort a whole install, passed every check in this file.
      - name: The installer library, executed
        run: ./scripts/verify-installer-lib.sh

  # R-UI-12: capture every page in both palettes, look at them, and fail when
  # one changed shape without somebody accepting it.
  #
  # This is the job that would have caught K-13 — 39% of the join warning
  # behind an inner scrollbar — which every other check in this file passed.
  # It needs the whole stack up: a real daemon, a real Node-RED, the real
  # dashboard and a real browser, which is why it is its own job rather than a
  # step in `test`.
  console-pages:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the step below can ask what this pull
          # request actually changed rather than guessing from one commit.
          fetch-depth: 0
      # This job is four minutes and the other three are one between them, and
      # it runs on every commit — including the many that cannot possibly move
      # a pixel. A day of work on this branch spent it repeatedly on changes
      # to `docs/`.
      #
      # The test is deliberately an *exclusion*, not a list of paths that
      # matter. The obvious filter — run when `flows/` or the widget packages
      # change — is wrong, because a page's shape is its geometry and its
      # geometry follows its words: an edit to a sentence in `net/reach`
      # changes the width of a row. Nearly all of this repository can move a
      # page, so the only safe question is whether a change is provably unable
      # to, and documentation is the one honest answer. `docs/console` is
      # excluded from the exclusion: those are the references themselves.
      #
      # The job still runs and still reports, so a required check is never
      # left pending; it just finishes in seconds when there is nothing here
      # that could have moved anything.
      - name: Decide whether anything in this change could move a page
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request; capturing"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          changed=$(git diff --name-only "$base"...HEAD)
          # Anything that is not documentation, or is documentation *of the
          # console itself*, means capture.
          if printf '%s\n' "$changed" | grep -qE '^docs/console/'; then
            echo "the console's own references changed; capturing"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | grep -qvE '^docs/'; then
            echo "something outside docs/ changed; capturing"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "only documentation outside docs/console changed; skipping the capture"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      # The same staged tree a board gets. linux-x64 here rather than the
      # arm64 a Pi runs, because this runner has to execute it.
      #
      # `--only console`, because that is genuinely all this job reads:
      # verify-pages.sh wants vendor/console/node_modules/node-red/red.js and
      # the dashboard beside it, and nothing else. Before mavlink-router
      # joined the payload this job also downloaded a Node runtime and a
      # ZeroTier .deb it never opened, which was merely wasteful; the router
      # is a C++ build in a container, which would have made a page-capture
      # job depend on a Docker daemon being present on the runner. The
      # payload-mavlink-router job below is where that build is proven.
      - name: Stage the console tree
        run: ./installer/make-payload.sh --arch linux-x64 --only console
      # --with-deps is an apt install under sudo. A GitHub-hosted VM is new
      # every run and needs it; a persistent runner had those libraries
      # installed once, so asking for them per job is sudo and bandwidth spent
      # on a no-op. The browser itself is cached either way.
      - name: Install the browser the capture gate needs
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: Verify the pages, and capture them
        run: ./scripts/verify-pages.sh
      # Geometry is per-platform — the system font stack resolves differently
      # here than on a laptop — so references are named for the platform that
      # recorded them and this checks the ones for *this* one. A first run on a
      # new platform records a baseline and fails here, which is correct: a
      # baseline nobody reviewed is not a baseline.
      #
      # `git status --porcelain`, not `git diff --exit-code`: every committed
      # reference is a `.darwin.json` and this runner is Linux, so the capture
      # gate takes its *record* branch and writes `.linux.json` files that are
      # **untracked** — which `git diff` does not see. It exited 0 on every
      # run, and neither half of the shape gate was enforced on the only
      # machine that runs it unattended. Pictures are not checked here at all,
      # deliberately: they are per-platform pixels and diffing them across
      # runners is a coin toss about font rasterisation, which is the whole
      # reason the reference is geometry. The run's own are uploaded below.
      - name: Check the recorded shape is current and committed
        run: |
          out=$(git status --porcelain docs/console/shape)
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            echo "::error::the shape references for this platform are not what this run recorded"
            echo "download the console-pages artifact, review the new shape, and commit it"
            exit 1
          fi
      # The unmasked pictures, so a reviewer can look at what the run saw
      # rather than at a description of it — and the shape this run recorded,
      # because the step above tells a reviewer to download this artifact and
      # commit that shape, and for as long as only the pictures were in here
      # that instruction could not be followed. It is the first-run case that
      # needs it: a platform with no reference at all records thirty-odd new
      # files and there is nowhere else to get them from.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-pages
          path: |
            vendor/capture/
            docs/console/shape/
          if-no-files-found: warn
          # Storage is billed on a private repository no matter which runner
          # produced it — a self-hosted runner saves minutes, not gigabytes.
          # These are looked at while the pull request is open, and never
          # again; 90 days of every run's captures is paying to keep pictures
          # nobody opens.
          retention-days: 7

  # yonder-core declares `engines.node >= 20` and `20-yonder-core.sh` calls
  # `require_node 20`, and that floor is load-bearing rather than decorative:
  # the installer deliberately supports a board with a distro node 20 and no
  # vendored payload. It installs a working daemon there and stops at the
  # console with a reason (see 30-console.sh). Nothing tested that once the
  # main job moved to 24, so a change needing 22 would have shipped a daemon
  # that cannot start on the runtime its own installer accepts — found on a
  # board, not here.
  #
  # yonder-core only. The contrib packages need node-red, which needs 22.9, so
  # running them here would assert something that was never true. Verified to
  # pass on 20.20.2 before this job was added, rather than added hopefully.
  core-on-its-floor:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # The workspace root's install resolves every package; only yonder-core
      # is then exercised.
      - run: npm ci
      - run: npx vitest run --root packages/yonder-core

  # mavlink-router, built for the architecture a board actually runs.
  #
  # It is the one payload component that is *built* rather than downloaded: it
  # is not in Debian and publishes no binary. Task 2 measured what building it
  # on the board costs — three packages missing from a stock image, one of them
  # (`systemd-dev`) named nothing like the error it produces, and a default
  # parallel build killed by the OOM killer on a 905 MiB Pi 4 — against a
  # 325 KB result. So it is built here and carried, which is R-VPN-08's shape
  # applied to a source build (R-CFG-07, R-MAV-17).
  #
  # arm64, under emulation, because that is what flies. The runner is x86 on
  # the hosted image, and `make-payload.sh` builds inside a debian:trixie
  # container for `linux/arm64`; setup-qemu-action is what registers the
  # handlers that makes that container runnable. **A runner with no Docker
  # daemon cannot run this job** — that is the one thing to watch if CI_RUNNER
  # is ever pointed at a machine without one.
  payload-mavlink-router:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the step below can ask what this pull
          # request actually changed.
          fetch-depth: 0
      # An emulated C++ build is minutes, and unlike the page capture below
      # its inputs are provably narrow: the pinned commit, the container image
      # and the recipe all live in installer/make-payload.sh, and nothing else
      # in this repository can change a byte of the result. A role or a unit
      # file changing does not rebuild it, because neither is an input.
      #
      # The job still runs and still reports, so a required check is never
      # left pending.
      - name: Decide whether anything in this change could alter the binary
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request; building"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          if git diff --name-only "$base"...HEAD | grep -qxF 'installer/make-payload.sh'; then
            echo "the pin or the recipe changed; building"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing that feeds this build changed; skipping it"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up the emulation an arm64 container needs
        if: steps.scope.outputs.run == 'true'
        uses: docker/setup-qemu-action@v3
      # Verifies the pinned commit, builds in debian:trixie for linux/arm64,
      # and refuses to stage a binary whose own --version does not report the
      # pinned commit. See the step's comments for why the fingerprint is the
      # commit rather than a hash of the binary.
      - name: Build it from the pinned commit
        if: steps.scope.outputs.run == 'true'
        run: ./installer/make-payload.sh --arch linux-arm64 --only mavlink-router
      # ELF's own e_machine, read out of the header: 183 is aarch64. This is
      # the check installer/roles/15-mavlink-router.sh makes against a binary
      # this root already runs, exercised here where the answer is known —
      # an x86 binary staged into an arm64 payload otherwise passes every
      # check an installer makes and is `Exec format error` on a board.
      - name: It is an aarch64 binary
        if: steps.scope.outputs.run == 'true'
        run: |
          m=$(/bin/sh -c '. ./installer/lib/common.sh; elf_machine "$1"' sh \
                vendor/mavlink-router/mavlink-routerd)
          echo "ELF e_machine: $m"
          [ "$m" = "183" ] || { echo "::error::not an aarch64 binary"; exit 1; }
      # So a payload can be assembled on a machine with no Docker: download
      # this, drop it in vendor/mavlink-router/, and the install role takes it
      # from there.
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.run == 'true'
        with:
          name: mavlink-routerd-arm64
          path: vendor/mavlink-router/mavlink-routerd
          if-no-files-found: error
          retention-days: 7

  # MPP, librga and gstreamer-rockchip, built for the board that has the
  # hardware. No repository packages them (R-HW-03, R-CFG-07); the pins and
  # the recipe live in installer/make-payload.sh, so as for mavlink-router
  # only a change to that file rebuilds this.
  payload-gst-rockchip:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether anything in this change could alter the plugin
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request; building"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          if git diff --name-only "$base"...HEAD | grep -qxF 'installer/make-payload.sh'; then
            echo "the pins or the recipe changed; building"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing that feeds this build changed; skipping it"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up the emulation an arm64 container needs
        if: steps.scope.outputs.run == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Build MPP, librga and the plugin from the pinned commits
        if: steps.scope.outputs.run == 'true'
        run: ./installer/make-payload.sh --arch linux-arm64 --only gst-rockchip
      # Every real object staged is an aarch64 ELF. 183 is aarch64; the check
      # is the one 52-gst-rockchip.sh makes on the board, exercised where the
      # answer is known.
      - name: They are aarch64 objects
        if: steps.scope.outputs.run == 'true'
        run: |
          find vendor/gst-rockchip -type f -name '*.so*' | while read -r f; do
            m=$(/bin/sh -c '. ./installer/lib/common.sh; elf_machine "$1"' sh "$f")
            echo "$f: ELF e_machine $m"
            [ "$m" = "183" ] || { echo "::error::$f is not an aarch64 object"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.run == 'true'
        with:
          name: gst-rockchip-arm64
          path: vendor/gst-rockchip
          if-no-files-found: error
